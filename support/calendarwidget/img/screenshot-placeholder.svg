<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="960"
  viewBox="0 0 1600 960"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Calendar Widget Screenshot Placeholder</title>
  <desc id="desc">
    Temporary screenshot mockup for Calendar Widget support page.
  </desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f8ff" />
      <stop offset="100%" stop-color="#e5ebff" />
    </linearGradient>
    <linearGradient id="widget" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#wall)" />

  <circle cx="1460" cy="110" r="180" fill="#a3dcff" fill-opacity="0.35" />
  <circle cx="200" cy="870" r="220" fill="#9cb1ff" fill-opacity="0.28" />

  <rect
    x="430"
    y="120"
    width="740"
    height="720"
    rx="36"
    fill="url(#widget)"
    stroke="#c7d5ff"
    stroke-width="3"
    filter="url(#shadow)"
  />

  <text
    x="800"
    y="194"
    fill="#3f57cc"
    text-anchor="middle"
    font-family="Avenir, Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="700"
  >
    Calendar Widget
  </text>
  <text
    x="800"
    y="244"
    fill="#7f8dc3"
    text-anchor="middle"
    font-family="Avenir, Helvetica, Arial, sans-serif"
    font-size="24"
  >
    Screenshot Placeholder
  </text>

  <g fill="#4f66d9" font-family="Avenir, Helvetica, Arial, sans-serif">
    <text x="490" y="320" font-size="18" font-weight="700">SUN</text>
    <text x="590" y="320" font-size="18" font-weight="700">MON</text>
    <text x="690" y="320" font-size="18" font-weight="700">TUE</text>
    <text x="790" y="320" font-size="18" font-weight="700">WED</text>
    <text x="890" y="320" font-size="18" font-weight="700">THU</text>
    <text x="990" y="320" font-size="18" font-weight="700">FRI</text>
    <text x="1090" y="320" font-size="18" font-weight="700">SAT</text>
  </g>

  <g
