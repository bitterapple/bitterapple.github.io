    <text x="520" y="392">1</text>
    <text x="620" y="392">2</text>
    <text x="720" y="392">3</text>
    <text x="820" y="392">4</text>
    <text x="920" y="392">5</text>
    <text x="1020" y="392">6</text>
    <text x="1120" y="392">7</text>

    <text x="520" y="472">8</text>
    <text x="620" y="472">9</text>
    <text x="720" y="472">10</text>
    <text x="820" y="472">11</text>
    <text x="920" y="472">12</text>
    <text x="1020" y="472">13</text>
    <text x="1120" y="472">14</text>

    <text x="520" y="552">15</text>
    <text x="620" y="552">16</text>
    <text x="720" y="552">17</text>
    <text x="820" y="552">18</text>
    <text x="920" y="552">19</text>
    <text x="1020" y="552">20</text>
    <text x="1120" y="552">21</text>

    <text x="520" y="632">22</text>
    <text x="620" y="632">23</text>
    <text x="720" y="632">24</text>
    <text x="820" y="632">25</text>
    <text x="920" y="632">26</text>
    <text x="1020" y="632">27</text>
